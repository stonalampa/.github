name: Go CI

# Reusable workflow: callers use
#   jobs:
#     ci:
#       uses: stonalampa/.github/.github/workflows/go-ci.yml@v1
# The resulting status check is named "ci / check".
on:
  workflow_call:
    inputs:
      golangci-lint-version:
        description: golangci-lint version to install
        type: string
        default: v2.15

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci-lint-version }}
          install-only: true
      - name: Vet
        run: make vet
      - name: Test
        run: make test
      - name: Lint
        run: make lint
      - name: Vulnerability check
        run: make vuln
